<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de Activos - Lab Electrónica</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --txt:#1c2430; --mut:#6b7686; --line:#e2e6ec;
  --pri:#2563eb; --ok:#15803d; --okbg:#dcfce7; --warn:#b45309; --warnbg:#fef3c7;
  --bad:#b91c1c; --badbg:#fee2e2; --info:#1d4ed8; --infobg:#dbeafe; --bar:#3b82f6;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f141b; --card:#1a212b; --txt:#e6eaf0; --mut:#98a3b3; --line:#2b3441;
    --pri:#60a5fa; --ok:#4ade80; --okbg:#14532d; --warn:#fbbf24; --warnbg:#4a3508;
    --bad:#f87171; --badbg:#4c1d1d; --info:#93c5fd; --infobg:#1e3a8a; --bar:#60a5fa;
  }
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0}
.right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--mut)}
.dot{width:10px;height:10px;border-radius:50%;background:#9ca3af;display:inline-block}
.dot.on{background:#22c55e}
main{max-width:1150px;margin:0 auto;padding:14px}
button,select,input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--txt)}
button{cursor:pointer}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
button.dan{color:var(--bad);border-color:var(--bad)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
nav button.act{background:var(--pri);color:#fff;border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:26px}
.kpi span{color:var(--mut);font-size:12px}
